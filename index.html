<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyQuest - 每日冒險卡牌包</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- 頂部導覽列 (Header) -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/80 border-b border-slate-200/80 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <!-- 左側 Logo -->
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-200 text-white font-black text-xl">
                    D
                </div>
                <div>
                    <h1 class="font-extrabold text-lg bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tight">DailyQuest</h1>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">每日冒險卡牌包</p>
                </div>
            </div>

            <!-- 右側資訊與操作 -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                <!-- 連續探索天數 -->
                <div class="flex items-center space-x-1.5 bg-amber-50 border border-amber-200/60 px-3 py-1.5 rounded-full shadow-xs">
                    <span class="text-amber-500 text-sm">🔥</span>
                    <span class="text-xs sm:text-sm font-bold text-amber-800" id="header-streak">連續冒險：0 天</span>
                </div>
                <!-- 冒險收集總數 -->
                <div class="hidden sm:flex items-center space-x-1.5 bg-indigo-50 border border-indigo-200/60 px-3 py-1.5 rounded-full shadow-xs">
                    <span class="text-indigo-500 text-sm">📖</span>
                    <span class="text-xs sm:text-sm font-bold text-indigo-800" id="header-journals">已收錄回憶：0 張</span>
                </div>
                <!-- 音效開關 -->
                <button id="sound-toggle" onclick="toggleSound()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-colors shadow-xs cursor-pointer" title="音效開關">
                    🔊
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full space-y-10">

        <!-- 主視覺：每日抽卡區 (Hero & Card Draw Area) -->
        <section class="bg-gradient-to-b from-indigo-900 via-indigo-800 to-slate-900 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden">
            <div class="absolute -right-20 -top-20 w-64 h-64 rounded-full bg-violet-500/20 blur-3xl pointer-events-none"></div>
            <div class="absolute -left-20 -bottom-20 w-64 h-64 rounded-full bg-indigo-500/20 blur-3xl pointer-events-none"></div>

            <div class="relative z-10 text-center max-w-xl mx-auto space-y-3 mb-8">
                <span class="inline-block px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-semibold tracking-wider uppercase text-indigo-200 border border-white/10">
                    Daily Card Pack
                </span>
                <h2 id="draw-title" class="text-2xl sm:text-3xl font-black tracking-tight">開啟今日的冒險卡牌包</h2>
                <p id="draw-desc" class="text-indigo-200 text-sm sm:text-base">
                    請翻開您的三張卡牌，解鎖今天的微任務，打破生活的小枯燥。
                </p>
            </div>

            <!-- 卡牌展示區 -->
            <div id="card-container" class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-3xl mx-auto perspective-1000">
                <!-- 動態生成的 3 張卡片將透過 JS 渲染 -->
            </div>
        </section>

        <!-- 今日任務清單區 (Today's Quest Board) -->
        <section class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
                <div>
                    <h3 class="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                        <span>🎯</span> 今日任務清單
                    </h3>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">完成任務後可記錄專屬心情，並收錄至冒險日誌。</p>
                </div>
                <div class="flex items-center gap-2.5">
                    <button onclick="openCustomTaskModal()" class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 text-xs sm:text-sm font-bold rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
                        <span>➕</span> 新增自訂任務
                    </button>
                    <button id="reroll-btn" onclick="rerollTask()" class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 text-xs sm:text-sm font-bold rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
                        <span>🎲</span> 更換卡牌 (<span id="reroll-count">1</span>/1)
                    </button>
                </div>
            </div>

            <!-- 任務卡片網格 -->
            <div id="task-board" class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <!-- 動態任務卡片 -->
            </div>
        </section>

        <!-- 冒險日誌與里程碑 (Adventure Journal & Milestones) -->
        <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
            <!-- Tab 切換列 -->
            <div class="flex border-b border-slate-200">
                <button onclick="switchTab('journal')" id="tab-journal-btn" class="pb-3 px-4 font-bold text-sm sm:text-base border-b-2 border-indigo-600 text-indigo-600 transition-colors cursor-pointer flex items-center gap-2">
                    <span>📖</span> 我的冒險日誌 (<span id="journal-count-tab">0</span>)
                </button>
                <button onclick="switchTab('milestones')" id="tab-milestones-btn" class="pb-3 px-4 font-bold text-sm sm:text-base border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors cursor-pointer flex items-center gap-2">
                    <span>🏅</span> 里程碑徽章 (<span id="milestone-count-tab">0</span>/4)
                </button>
            </div>

            <!-- 分頁 1：我的冒險日誌 -->
            <div id="tab-journal-content" class="space-y-4">
                <div id="journal-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 動態日誌卡片 -->
                </div>
            </div>

            <!-- 分頁 2：里程碑徽章 -->
            <div id="tab-milestones-content" class="hidden space-y-4">
                <div id="milestones-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 動態徽章卡片 -->
                </div>
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="border-t border-slate-200 bg-white py-6 mt-12 text-center text-xs text-slate-400">
        <p>DailyQuest 每日冒險卡牌包 &copy; 2026. 用微小的好習慣點綴生活每一天。</p>
    </footer>

    <!-- 完成任務心得 Modal -->
    <div id="complete-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-5 transform transition-all animate-in fade-in zoom-in-95">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-xl shadow-xs">
                    🎉
                </div>
                <h3 class="text-xl font-black text-slate-900">恭喜完成冒險任務！</h3>
                <p id="modal-task-title" class="text-sm font-semibold text-indigo-600"></p>
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                    請用一句話記錄此刻的心情或想法（選填）
                </label>
                <input type="text" id="modal-note-input" placeholder="例如：感覺神清氣爽，今天也有好心情！" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition-all">
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button onclick="closeCompleteModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all cursor-pointer">
                    取消
                </button>
                <button onclick="confirmCompleteTask()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md shadow-indigo-200 transition-all cursor-pointer">
                    收錄至冒險日誌
                </button>
            </div>
        </div>
    </div>

    <!-- 新增自訂任務 Modal -->
    <div id="custom-task-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-5">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto text-xl shadow-xs">
                    ✍️
                </div>
                <h3 class="text-xl font-black text-slate-900">新增自訂微冒險</h3>
                <p class="text-xs text-slate-500">為自己量身打造一個今日的小目標。</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">任務內容</label>
                    <input type="text" id="custom-title-input" placeholder="例如：寫下三件今天感謝的事" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">任務類別</label>
                    <select id="custom-category-select" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition-all">
                        <option value="健康">健康 (Health)</option>
                        <option value="心靈">心靈 (Mind)</option>
                        <option value="探索">探索 (Explore)</option>
                        <option value="成長">成長 (Growth)</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button onclick="closeCustomTaskModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all cursor-pointer">
                    取消
                </button>
                <button onclick="saveCustomTask()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md shadow-indigo-200 transition-all cursor-pointer">
                    確認新增
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>
</html>
